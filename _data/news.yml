items:
  - date: "2026-10-19"
    title:
      ja: ツリーハウスを、少し模様替え。
      en: A few changes around the treehouse.
      zh: 树屋，添了几个新角落。
    body:
      ja: 三言語で読める Profile と写真のページ、そして近況の欄を用意しました。これから少しずつ、中身を増やしていきます。
      en: The treehouse now has a trilingual Profile, a photography page, and a place for updates. More will find its way here, little by little.
      zh: 树屋加入了三语 Profile、摄影作品页面和新鲜事栏目，之后会慢慢把内容补上。
    url: /profile/
  - date: "2026-10-19T17:31:25+09:00"
    title:
      ja: パクチージン
      en: Cilantro gin
      zh: 香菜 gin
    body:
      ja: パクチージン、思っていたほどおいしくなかった。
      en: Cilantro gin wasn’t as good as I expected.
      zh: 香菜gin酒没我想象中那么好喝。
  - date: "2026-10-20T22:48:41+09:00"
    title:
      ja: 初めての茶道体験
      en: My first Japanese tea ceremony
      zh: 第一次体验日本茶道
    body:
      ja: 今日、初めて日本の茶道を体験しました。新鮮で、とても楽しかったです。
      en: I experienced a Japanese tea ceremony for the first time today. It felt new and fascinating, and I really enjoyed it.
      zh: 今天第一次体验了日本的茶道，感觉又新奇又有趣。
  - date: "2026-10-21T12:11:16+09:00"
    title:
      ja: 日々のリズム
      en: Finding a rhythm
      zh: 节奏感
    body:
      ja: ふと、そろそろ博士論文を書き始めなければと気づきました。人生には大きな課題がいくつもありますが、月ごと、週ごと、さらには日ごとに目を向けると、こなさなければならない小さな課題もたくさんあります。やはり、日々のリズムをつくることはとても大切ですね。
      en: I suddenly realized it’s time to start writing my doctoral dissertation. Life is full of big tasks, and each month, week, or even day brings plenty of smaller tasks that need to get done. Having a sense of rhythm really matters.
      zh: 突然意识到自己该开始写博论了。人生里有许多大任务，具体到某个月、某一周甚至某一天都会有许多小任务必须去完成，节奏感这件事还是太重要了。
  - date: "2026-10-23T12:29:56+09:00"
    title:
      ja: ある言葉
      en: A quote
      zh: 一段摘录
    body:
      ja: |-
        「人の感情は他人に影響を与えるためのものであり、自分自身を左右するためのものではない。
        公の場での発言は立場と利益を守るためのものであり、自分の思想や認識を表すためのものではない。」
      en: |-
        “Our emotions are meant to influence others, not to control us.
        Public statements are meant to protect our positions and interests, not to express our thoughts and understanding.”
      zh: |-
        “人的情绪是用来影响他人的，而不是左右自己的。
        公开的言论是用来维护立场和利益的，不是表达自己思想和认知的。”
