  home:
    greeting: こんにちは、Jinqian です。
    eyebrow: A LITTLE TREEHOUSE ON THE INTERNET
    lead: つくったもの、ふと浮かんだ考え、そしてこれまでの歩みを、ここに置いています。
    intro: かしこまった自己紹介というより、私を知ってもらうための小さな窓のような場所です。写真や記事、これまでの経験から、気になるものをのぞいてみてください。
    work_button: Profile を見る
    explore: どうぞ、ごゆっくり。
    recent: 最近書いたもの
    photo_button: 写真を見る
    photo_card: 日常や旅の途中で出会った景色。
    profile_card: これまでの歩み、研究、そして好きなこと。
    quote:
      text: 我れは自ら我が肉體に依つて、我が精神に依つて之れを經驗した、我れは種々の罪障をも大いに必要した、我れは快樂をも、貪慾をも、虛榮をも、又最も輕蔑すべき絶望をもすべて皆必要とした、我れにとつては其等は皆總て意義有る必要事であつたのだ――反抗を放棄する事を學び知る爲めには、世界を愛する事を學び知る爲めには、我れが希望し空想する如き世界を捏上げて之れを現實の世界と比較するが如き愚を止め、此世界を有るがまゝに委せて、然も之れを愛し、喜んで之れに歸順せんとするに至るまでは、有らゆる其等の迷妄が亦我れにとつて必然な物であつたのだ。
      book: 『シッタルタ』
      credit: ヘルマン・ヘッセ · 三井光弥訳（1925）· 155頁
      source_url: https://dl.ndl.go.jp/pid/1716174/1/84
    articles_card: 考えたことや気づいたことを、少し長い文章に。
  blog:
    lead: 毎回、答えがあるわけではありません。ただ、ひとつの考えを残しておきたい日もあります。
  project_entries:
    treehouse:
      title: この個人サイト
      description: 学術向けのテンプレートから、自分らしい場所をつくる。
      category: 個人のスペース
      body: "このサイトは al-folio をもとにつくり、GitHub Pages で公開しています。


        トップページは歓迎の場所に。写真のページには作品を、記事のページには考えたことをまとめています。Profile では、これまでの歩みや研究、好きなことを紹介しています。


        内容が増えるにつれて、サイトも少しずつ育っていくはず。まずは記録を始めて、自分らしい形を見つけていきたいと思います。"
  profile:
    about: 私について
    education: Education
    research: Research interests
    publications: Publications
    current_work: いま取り組んでいること
    skills: 好きなこと・できること
    sports: スポーツ
    music: 楽器
    interests: 興味のあること
    work_body: 原文の再構成に基づく、語り手の複数の物語にわたる再話の一貫性と、そのマルチモーダルな表出特徴について論文を執筆しています。今後、分野を代表する学術誌への投稿を目指しています。
    sports_items:
      - バスケットボール
      - バドミントン
      - 卓球
      - テニス（最近、特に夢中）
      - 登山
    clarinet: 中国音楽学院のアマチュア演奏能力試験・最高級に合格。
    interest_items:
      - 読書
      - ブレインストーミング
      - 不思議なものを集めること
      - 写真
    cv: CV
    bio: 中国・遼寧省丹東市で生まれました。北朝鮮に隣接する、中国最大の国境都市です。国境のそばで育った経験から、この世界にある無数の可能性を、もっと知りたいと思うようになりました。
    status: PhD candidate in Information Science
  photos:
    intro: 日常の光や、旅先でふと足を止めた景色。写真を少しずつ集めていきます。
    empty_title: 最初の一枚を、もう少しだけ。
    empty_body: 写真を選んでいるところです。準備ができたら、ここに並べていきます。
    view_full: 元のサイズで見る ↗
