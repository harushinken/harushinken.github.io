  home:
    greeting: Hi, I’m Jinqian.
    eyebrow: A LITTLE TREEHOUSE ON THE INTERNET
    lead: A place for things I’ve made, thoughts I’ve jotted down, and the path I’ve taken so far.
    intro: Think of this as a small window into my world rather than a formal introduction. Start with a photograph, a post, or a moment
      from my background—whatever catches your eye.
    work_button: Explore my profile
    explore: Take your time. Have a look around.
    recent: Recent writing
    photo_button: See my photography
    photo_card: Scenes from everyday life and places along the way.
    profile_card: Background, research, and things I enjoy.
    quote:
      text: I have experienced on my body and on my soul that I needed sin very much, I needed lust, the desire for possessions, vanity,
        and needed the most shameful despair, in order to learn how to give up all resistance, in order to learn how to love the world, in
        order to stop comparing it to some world I wished, I imagined, some kind of perfection I had made up, but to leave it as it is and
        to love it and to enjoy being a part of it.
      book: Siddhartha
      credit: Hermann Hesse · G. Olesch et al., 2001 · “Govinda”
      source_url: https://www.gutenberg.org/files/2500/2500-h/2500-h.htm
    articles_card: Ideas, reflections, and longer notes from the treehouse.
  blog:
    lead: Not every post has an answer. Sometimes, I just want to hold on to a thought.
  project_entries:
    treehouse:
      title: This personal website
      description: Starting with an academic template and making a space that feels more like me.
      category: A personal space
      body: "This site is built with al-folio and hosted on GitHub Pages.


        The home page is a welcome, Photography is for images, and Articles is for longer writing. Profile brings together my background,
        research, and interests.


        The site will grow along with its contents. First, start keeping a record; then, gradually find a shape that feels right."
  profile:
    about: A little about me
    education: Education
    research: Research interests
    publications: Publications
    current_work: What I’m working on
    skills: Skills & interests
    sports: Sports
    music: Music
    interests: Interests
    work_body: I’m writing a paper on narrators’ consistency across retellings of different stories, using source-text-based narrative reconstruction,
      and its multimodal behavioral characteristics. I plan to submit it to a leading journal.
    sports_items:
      - Basketball
      - Badminton
      - Table tennis
      - Tennis (my current obsession)
      - Hiking
    clarinet: Highest grade in the amateur proficiency examination, China Conservatory of Music.
    interest_items:
      - Reading
      - Brainstorming
      - Collecting unusual things
      - Photography
    cv: CV
    bio: I was born in Dandong, Liaoning, China, the country’s largest border city, right next to North Korea. Growing up on a border made
      me curious about the countless possibilities of living in this world, and that curiosity keeps me exploring.
    status: PhD candidate in Information Science
