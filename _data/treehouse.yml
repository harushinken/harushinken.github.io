    eyebrow: A LITTLE TREEHOUSE ON THE INTERNET
    lead: 这里放着我做过的事、随手写下的想法，以及一路走来的经历。
    intro: 比起一份正式的介绍，我更想把这里当作一扇窗。你可以从一张照片、一篇文章，或者一段经历开始认识我。
    work_button: 认识一下我
    explore: 慢慢逛，不着急。
    recent: 最近写了
    photo_button: 看看摄影作品
    photo_card: 日常和旅行中，让我停下脚步的风景。
    profile_card: 一路走来的经历、研究，以及喜欢的东西。
    quote:
      text: 我听凭灵魂与肉体的安排，去经历罪孽，追逐肉欲和财富，去贪慕虚荣，以陷入最羞耻的绝望，以学会放弃挣扎，学会热爱世界。我不再将这个世界与我所期待的、塑造的圆满世界比照，而是接受这个世界，爱它，属于它。
      book: 《悉达多》
      credit: 赫尔曼·黑塞
      source_url: ""
    articles_card: 想法、思考，以及想慢慢写下来的文章。
  blog:
    lead: 不一定每篇都有答案。有时，只是想把一个念头留下来。
  project_entries:
    treehouse:
      title: 这个个人主页
      description: 从一份学术模板，开始搭一个更像自己的空间。
      category: 个人空间
      body: "这个网站基于 al-folio 搭建，放在 GitHub Pages 上。


        首页是欢迎页，“摄影作品”放照片，“文章”留给长一点的想法。Profile 则整理个人经历、研究和兴趣。


        网站也会随着内容慢慢生长。先开始记录，再慢慢找到自己的样子。"
